<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOXBASE — what's in the box</title>
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BOXBASE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="med.js"></script>
<style>
:root{
  --kraft:#c8a26a; --kraft-d:#a9824b; --paper:#f5efe3; --ink:#141210;
  --hot:#ff4f12; --tape:#e8d9b8; --muted:#5c5246;
  --stencil:'Big Shoulders Stencil Display',Impact,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{
  font-family:var(--sans); color:var(--ink); min-height:100vh; min-height:100dvh;
  background:
    repeating-linear-gradient(92deg,rgba(0,0,0,.025) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(-3deg,rgba(255,255,255,.04) 0 1px,transparent 1px 11px),
    var(--kraft);
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{font-size:16px} /* stops iOS zoom-on-focus */
button,a,label{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{cursor:pointer}
a{color:inherit}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;gap:10px;min-height:56px;
  padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));
  border-bottom:4px solid var(--hot)}
.logo{font-family:var(--stencil);font-weight:900;font-size:30px;letter-spacing:.04em;text-decoration:none;line-height:1}
.logo span{color:var(--hot)}
.back{display:flex;align-items:center;gap:4px;text-decoration:none;font-family:var(--mono);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.08em;height:40px;padding-right:10px}
.back b{font-size:26px;line-height:1;color:var(--hot);margin-top:-3px}
.bar .ttl{margin-left:auto;font-family:var(--stencil);font-weight:900;font-size:24px;letter-spacing:.05em;color:var(--hot)}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);border-top:3px solid var(--ink);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#9b9183;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 0 2px;min-height:48px}
.tabs a svg{width:24px;height:24px}
.tabs a.on{color:var(--hot)}
.tabs .plus{justify-self:center;width:62px;height:62px;margin-top:-26px;background:var(--hot);color:var(--ink);
  border:3px solid var(--ink);box-shadow:0 0 0 3px var(--hot);display:grid;place-items:center;padding:0;transform:rotate(-3deg)}
.tabs .plus svg{width:30px;height:30px}
.tabs .plus:active{transform:rotate(-3deg) scale(.92)}

main{max-width:1080px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left))}
@media(min-width:900px){ .tabs{left:50%;right:auto;transform:translateX(-50%);width:460px;bottom:14px;border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.35)} }

/* ---------- shared ---------- */
.tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.card{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.btn{background:var(--paper);border:2.5px solid var(--ink);padding:10px 14px;font-family:var(--mono);
  font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s, box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.hot{background:var(--hot)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{background:transparent;border-color:#8a1c00;color:#8a1c00;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{width:100%;background:transparent;border:none;border-bottom:2.5px solid var(--ink);padding:8px 2px;font-size:17px;outline:none}
.field:focus{border-bottom-color:var(--hot)}
.empty{font-family:var(--mono);font-size:14px;color:var(--muted);padding:30px 0;text-align:center}

/* ---------- home ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);padding:4px 14px}
.search input{flex:1;border:none;background:none;outline:none;font-size:20px;padding:12px 0;font-weight:500}
.search b{font-family:var(--stencil);font-size:28px;color:var(--hot)}
.stats{display:flex;gap:22px;margin:22px 2px 18px}
.stats div{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.stats strong{display:block;font-family:var(--stencil);font-size:40px;line-height:1;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.box{position:relative;display:block;text-decoration:none;padding:16px 16px 14px;min-height:170px;overflow:hidden}
.box::before{content:"";position:absolute;top:-6px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-2deg);
  background:var(--tape);opacity:.85;border:1px solid rgba(0,0,0,.08)}
.box .num{font-family:var(--stencil);font-weight:900;font-size:78px;line-height:.85;letter-spacing:-.01em}
.box .num small{font-size:22px;vertical-align:top;margin-right:3px;color:var(--hot)}
.box h3{font-size:18px;font-weight:800;margin-top:10px;line-height:1.15}
.box .meta{margin-top:6px}
.box .thumb{position:absolute;right:12px;top:16px;width:64px;height:64px;object-fit:cover;border:2.5px solid var(--ink);transform:rotate(3deg)}
.box .peek{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.hits{margin-top:18px;display:grid;gap:10px}
.hit{display:flex;align-items:center;gap:14px;padding:12px 14px;text-decoration:none}
.hit .n{font-family:var(--stencil);font-size:36px;line-height:1;min-width:58px;color:var(--hot);-webkit-text-stroke:1px var(--ink)}
.hit mark{background:var(--hot);color:var(--ink);padding:0 2px}

/* ---------- box view ---------- */
.head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:end;margin-bottom:22px}
.bignum{font-family:var(--stencil);font-weight:900;font-size:clamp(110px,26vw,190px);line-height:.8;color:var(--paper);
  -webkit-text-stroke:3px var(--ink);text-shadow:7px 7px 0 var(--ink)}
.head .name{font-size:clamp(24px,5vw,38px);font-weight:800;border-bottom-width:3px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
.cols>*,.head>*{min-width:0}
.add .field{min-width:0}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}.head{grid-template-columns:1fr}}
.panel{padding:18px}
.panel h2{font-family:var(--stencil);font-size:28px;letter-spacing:.03em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 .tag{font-size:11px}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input{flex:1}
.items{list-style:none}
.items li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1.5px dashed #b9ad97;font-size:16px}
.items li span{flex:1}
.items li .nm{flex:1;min-width:0;border:none;background:transparent;font-size:16px;padding:4px 2px;outline:none;border-bottom:2px solid transparent}
.items li .nm:focus{border-bottom-color:var(--hot)}
.items li .nm:placeholder-shown{border-bottom-color:var(--hot);background:rgba(255,79,18,.08)}
.it-ph{flex:none;width:56px;height:56px;border:2.5px solid var(--ink);background:#fff;object-fit:cover;display:block;cursor:zoom-in}
.it-add{flex:none;width:56px;height:56px;border:2px dashed #9c8f78;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:20px;color:var(--muted)}
.it-add:hover{border-color:var(--hot);color:var(--hot)}
.snap{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:14px;padding:16px;
  font-family:var(--stencil);font-weight:900;font-size:24px;letter-spacing:.05em;background:var(--ink);color:var(--paper);
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--hot);cursor:pointer}
.snap:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--hot)}
.snap svg{width:26px;height:26px}
.hit .hp{width:48px;height:48px;object-fit:cover;border:2px solid var(--ink);margin-left:auto}
.items li .q{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--paper);padding:2px 6px}
.x{border:none;background:none;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--muted);
  min-width:40px;min-height:40px;display:grid;place-items:center;flex:none}
.x:hover{color:var(--hot)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:10px}
.photos figure{position:relative;aspect-ratio:1;border:2.5px solid var(--ink);background:#ddd}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .x{position:absolute;top:0;right:0;min-width:30px;min-height:30px;background:var(--ink);color:var(--paper);font-size:12px;line-height:1}
.qrmini{display:flex;gap:14px;align-items:center;margin-top:14px}
.qrmini .q{width:92px;height:92px;background:#fff;border:2.5px solid var(--ink);padding:4px}
.qrmini .q svg{width:100%;height:100%;display:block}
label.l{display:block;margin-top:14px}
.lightbox{position:fixed;inset:0;background:rgba(20,18,16,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border:3px solid var(--paper)}

/* ---------- labels ---------- */
.lab-ctrl{padding:18px;margin-bottom:26px}
.lab-ctrl .row+.row{margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;padding:6px 9px;border:2px solid var(--ink);background:var(--paper)}
.chk input{accent-color:var(--hot)}
.sheet{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.sheet.s{grid-template-columns:repeat(3,1fr)}
.label{background:#fff;border:3px solid var(--ink);padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;break-inside:avoid;page-break-inside:avoid}
.label .q svg{width:118px;height:118px;display:block}
.sheet.s .label .q svg{width:84px;height:84px}
.label .ln{font-family:var(--stencil);font-weight:900;font-size:64px;line-height:.85}
.sheet.s .label .ln{font-size:44px}
.label .lt{font-weight:800;font-size:14px;margin-top:6px;line-height:1.15}
.label .lb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;border-top:2px solid var(--ink);padding-top:4px}
.blank-line{border-bottom:1.5px solid var(--ink);height:16px;margin-top:6px}

/* ---------- data ---------- */
.data .panel{margin-bottom:22px}
.data p{line-height:1.5;margin:6px 0 12px;max-width:62ch}
code{font-family:var(--mono);font-size:.88em;background:var(--tape);padding:1px 5px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:13px;padding:11px 16px;border-left:6px solid var(--hot);z-index:60;white-space:nowrap;
  animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
.lightbox{padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px;margin-bottom:18px;background:var(--hot)}
.stack{display:flex;flex-direction:column;gap:12px}
.btn.big{width:100%;padding:17px;font-size:15px}

/* ---------- medicines & expiry ---------- */
.snap.med{background:var(--hot);color:var(--ink);box-shadow:4px 4px 0 var(--ink);margin-top:-4px}
.exp{position:relative;flex:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:5px 6px;border:2px solid var(--ink);white-space:nowrap;line-height:1}
.exp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.exp.bad{background:#d7261e;color:#fff}
.exp.warn{background:#ffb000;color:var(--ink)}
.exp.ok{background:#2f9e44;color:#fff}
.exp.none{border:2px dashed #9c8f78;color:var(--muted);background:transparent}
.items li .nm{min-width:60px}
.expstrip{margin:0 0 20px}
.expstrip .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.expstrip .hd b{font-family:var(--stencil);font-size:26px;letter-spacing:.03em}
.expstrip .hd a{font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.exprow{display:flex;gap:12px;overflow-x:auto;padding:2px 6px 10px 2px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.expcard{flex:none;width:148px;scroll-snap-align:start;padding:10px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.expcard img{width:100%;height:72px;object-fit:cover;border:2px solid var(--ink)}
.expcard .nm2{font-weight:800;font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expcard .exp{align-self:flex-start}
.allgood{padding:12px 14px;font-family:var(--mono);font-size:12px}
.grp{font-family:var(--stencil);font-size:24px;letter-spacing:.04em;margin:22px 2px 10px;display:flex;align-items:center;gap:10px}
.grp i{width:14px;height:14px;border:2px solid var(--ink);display:inline-block}
.bx-exp{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 5px;border:2px solid var(--ink)}
.bx-exp.bad{background:#d7261e;color:#fff}.bx-exp.warn{background:#ffb000}
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(20,18,16,.6);display:flex;align-items:flex-end;justify-content:center}
.msheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;border-bottom:none;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.msheet h2{font-family:var(--stencil);font-size:28px;letter-spacing:.03em}
.ms-top{display:flex;gap:12px;align-items:center}
.ms-top img{width:84px;height:84px;object-fit:cover;border:2.5px solid var(--ink);flex:none}
.prog{height:8px;border:2px solid var(--ink);margin-top:8px;background:#fff}
.prog i{display:block;height:100%;width:8%;background:var(--hot);transition:width .25s}
.ms-st{font-family:var(--mono);font-size:13px;font-weight:700}
.ms-st.good{color:#1f7a33}.ms-st.warn{color:#9a5b00}
#mhint a{color:var(--ink)}

/* medicine rows: name on top, qty stepper + sealed/opened + expiry below */
.items li.medrow{align-items:flex-start}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mcol .nm{width:100%}
.msub{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.items li .stp{flex:none}
.stp{display:inline-flex;align-items:stretch;border:2px solid var(--ink);background:#fff;height:32px}
.stp button{width:32px;border:none;background:transparent;font-family:var(--mono);font-weight:700;font-size:17px;line-height:1;padding:0}
.stp button:active{background:var(--hot)}
.stp b{min-width:26px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.seal{height:32px;padding:0 8px;border:2px solid var(--ink);background:#fff;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.seal.open{background:var(--ink);color:var(--paper)}
.seal.open::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hot);margin-right:5px;vertical-align:1px}
.msub .exp{height:32px;display:inline-flex;align-items:center}
.seg{display:flex;border:2.5px solid var(--ink)}
.seg button{flex:1;padding:11px 6px;border:none;background:#fff;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.seg button+button{border-left:2.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}

/* ---------- move items between boxes ---------- */
.selbtn{border:2px solid var(--ink);background:#fff;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 10px;text-transform:uppercase}
.selbtn.on{background:var(--ink);color:var(--paper)}
.pick{flex:none;width:26px;height:26px;accent-color:var(--hot);margin:0}
.items.selecting li{cursor:pointer}
.items.selecting li > *:not(.pick), .items.selecting li .mcol *{pointer-events:none}
.items.selecting .x{display:none}
.items.selecting li.picked{background:rgba(255,79,18,.12)}
.movebar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:10px;align-items:center;
  padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:var(--ink);color:var(--paper);border-top:3px solid var(--hot)}
.movebar b{font-family:var(--stencil);font-size:21px;letter-spacing:.03em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movebar .btn{padding:10px 11px;white-space:nowrap}
.movebar .btn{box-shadow:none}
.boxpick{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;padding:2px 6px 6px 2px}
.boxpick button{display:flex;align-items:center;gap:14px;text-align:left;padding:10px 12px;background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.boxpick button:active{transform:translate(3px,3px);box-shadow:none}
.boxpick .n{font-family:var(--stencil);font-weight:900;font-size:40px;line-height:.9;min-width:56px}
.boxpick .t{font-weight:800;font-size:16px;line-height:1.15}
.boxpick .new{background:var(--hot)}

/* ---------- box VIEW mode: photo grid ---------- */
.modeseg{display:flex;border:2.5px solid var(--ink);margin-bottom:18px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.modeseg button{flex:1;padding:11px 6px;border:none;background:transparent;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.modeseg button+button{border-left:2.5px solid var(--ink)}
.modeseg button.on{background:var(--ink);color:var(--paper)}
.vhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.vhead .bignum{font-size:clamp(96px,24vw,150px)}
.vhead h1{font-size:clamp(24px,6vw,40px);font-weight:800;line-height:1.05}
.vhead .tag{margin-top:6px}
.vtools{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.vtools .search{box-shadow:4px 4px 0 var(--ink)}
.vtools .search input{font-size:17px;padding:11px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px}
.chip{flex:none;border:2px solid var(--ink);background:#fff;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;padding:8px 11px;text-transform:uppercase}
.chip.on{background:var(--ink);color:var(--paper)}
.chip i{font-style:normal;opacity:.6;margin-left:4px}
.boxshots{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.boxshots img{height:110px;border:3px solid var(--ink);flex:none;cursor:zoom-in}

<body>
<header class="bar noprint" id="bar"></header>
<main id="app"></main>
<nav class="tabs noprint">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>Boxes</a>
  <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>Find</a>
  <a href="#/new" class="plus" aria-label="New box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M12 4v16M4 12h16"/></svg></a>
  <a href="#/labels" data-nav="labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3M21 14v1"/></svg>Labels</a>
  <a href="#/data" data-nav="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>Backup</a>
</nav>

<script>
/* ================= storage (IndexedDB) ================= */
const DB = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open('boxbase', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('boxes', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('boxes', mode), s = t.objectStore('boxes');
      const out = fn(s);
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    all: () => tx('readonly', s => s.getAll()),
    put: b => tx('readwrite', s => s.put(b)),
    del: id => tx('readwrite', s => s.delete(id)),
    clear: () => tx('readwrite', s => s.clear()),
  };
})();
navigator.storage?.persist?.();

/* ================= state & helpers ================= */
let boxes = [];
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const byId = id => boxes.find(b => b.id === id);
const sorted = () => [...boxes].sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
const nextId = () => pad(boxes.reduce((m, b) => Math.max(m, parseInt(b.id) || 0), 0) + 1);
const newBox = id => ({ id, name: '', location: '', category: '', notes: '', items: [], photos: [], updated: Date.now() });

function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), 2200);
}
async function save(b) { b.updated = Date.now(); await DB.put(b); markChanged(); }

/* ---------- backup file (the safety net) ---------- */
const changes = () => +(localStorage.getItem('bb-dirty') || 0);
function markChanged() { localStorage.setItem('bb-dirty', changes() + 1); }
function ago(t) {
  if (!t) return 'never';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago';
}
function backupFile() {
  const json = JSON.stringify({ app: 'boxbase', v: 1, at: new Date().toISOString(), boxes });
  return new File([json], `boxbase-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
}
function markBackedUp() { localStorage.setItem('bb-dirty', 0); localStorage.setItem('bb-last', Date.now()); }
function download(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* on phones: share sheet → save straight to Google Drive / Files / WhatsApp; elsewhere: download */
async function saveBackup(forceDownload = false) {
  const file = backupFile();
  if (!forceDownload && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'BOXBASE backup' }); markBackedUp(); toast('Backup saved ✓'); }
    catch (e) { if (e.name !== 'AbortError') { download(file); markBackedUp(); } }
  } else { download(file); markBackedUp(); toast('Backup downloaded ✓'); }
  render();
}
/* ---------- family copy: data.json in the GitHub repo ---------- */
const FAMILY_FILE = 'data.json';
/* on open: pull the family copy if it's newer than what this phone has seen.
   Owner's own publishes are skipped; boxes removed from the family copy disappear on family phones. */
const isManager = () => localStorage.getItem('bb-manager') === '1' || !!localStorage.getItem('bb-last');
async function syncFamily() {
  if (isManager()) return;   // the phone that manages the boxes is the source — never overwrite it
  try {
    const r = await fetch(FAMILY_FILE + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const data = await r.json(); if (!Array.isArray(data.boxes) || !data.at) return;
    if (data.at <= (+localStorage.getItem('bb-published-at') || 0)) return;   // this phone published it
    if (data.at <= (+localStorage.getItem('bb-family-at') || 0)) return;      // already loaded
    const prevIds = JSON.parse(localStorage.getItem('bb-family-ids') || '[]');
    const ids = data.boxes.map(b => b.id);
    for (const id of prevIds) if (!ids.includes(id)) { const cur = byId(id); if (cur && (cur.updated || 0) <= data.at) await DB.del(id); }
    for (const b of data.boxes) {
      const cur = byId(b.id);
      if (!cur || (b.updated || 0) > (cur.updated || 0)) await DB.put({ ...newBox(b.id), ...b });   // strictly newer only — never swap your full photos for the shared small ones
    }
    localStorage.setItem('bb-family-at', data.at); localStorage.setItem('bb-family-ids', JSON.stringify(ids));
    boxes = await DB.all(); render();
    toast('Family copy updated · ' + new Date(data.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }));
  } catch (e) { console.warn('family sync', e); }
}

async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    const incoming = data.boxes;
    if (!Array.isArray(incoming)) throw 0;
    if (!confirm(`Load ${incoming.length} boxes from this backup? Boxes with the same number keep whichever version is newer.`)) return;
    let n = 0;
    for (const b of incoming) {
      const cur = byId(b.id);
      if (!cur || (b.updated || 0) >= (cur.updated || 0)) { await DB.put({ ...newBox(b.id), ...b }); n++; }
    }
    boxes = await DB.all(); localStorage.setItem('bb-dirty', 0);
    toast(`Loaded ${n} box${n === 1 ? '' : 'es'} ✓`); location.hash = '#/'; render();
  } catch { toast('That file isn’t a BOXBASE backup'); }
}

/* the link a QR code points to */
function baseUrl() {
  const custom = localStorage.getItem('bb-base');
  return custom || (location.origin + location.pathname);
}
const boxUrl = id => baseUrl() + '#/box/' + encodeURIComponent(id);
function qrSvg(text) {
  if (typeof qrcode === 'undefined') return '<div class="tag">QR lib offline</div>';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
}

/* item text: "3x socks" or "socks x3" → qty */
function parseItem(raw) {
  const t = raw.trim(); if (!t) return null;
  let m = t.match(/^(\d+)\s*[x×]\s*(.+)$/i) || t.match(/^(.+?)\s*[x×]\s*(\d+)$/i);
  if (m) { const [n, q] = /^\d+$/.test(m[1]) ? [m[2], m[1]] : [m[1], m[2]]; return { n: n.trim(), q: +q }; }
  return { n: t, q: 1 };
}

/* compress photo → JPEG dataURL (~100–200KB) */
async function compress(file) {
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1100 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72);
}

/* ================= renumber: close gaps so boxes run 01, 02, 03… ================= */
const numbered = () => sorted().filter(x => /^\d+$/.test(x.id));
const gapPlan = () => numbered().map((x, i) => [x.id, pad(i + 1)]).filter(([a, b]) => a !== b);
async function renumberAll() {
  const plan = gapPlan(); if (!plan.length) return toast('Numbers are already in order');
  if (!confirm(`Renumber boxes?\n\n${plan.map(([a]) => a).join(', ')} → ${plan.map(([, b]) => b).join(', ')}\n\nTheir QR labels will need reprinting.`)) return;
  for (const [from, to] of plan) {                    // ascending: each new number is always free
    const b = byId(from); await DB.del(from); b.id = to; await save(b);
  }
  boxes = await DB.all();
  toast('Renumbered — reprint these labels');
  location.hash = '#/labels?only=' + plan.map(([, b]) => b).join(',');
}

/* ================= labels → PDF (prints from any phone) ================= */
const loadScript = src => new Promise((res, rej) => {
  if ([...document.scripts].some(s => s.src === src)) return res();
  const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s);
});
async function labelsPdf(ids, small) {
  await loadScript(window.JSPDF_SRC || 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const M = 10, GAP = 5, cols = small ? 3 : 2;
  const W = (210 - 2 * M - GAP * (cols - 1)) / cols, H = small ? 40 : 56;
  const perPage = cols * Math.floor((297 - 2 * M + GAP) / (H + GAP));
  ids.forEach((id, n) => {
    if (n && n % perPage === 0) doc.addPage();
    const k = n % perPage, x = M + (k % cols) * (W + GAP), y = M + Math.floor(k / cols) * (H + GAP);
    doc.setDrawColor(20, 18, 16); doc.setLineWidth(0.8); doc.rect(x, y, W, H);
    // QR as vector squares (sharp at any size)
    const q = qrcode(0, 'M'); q.addData(boxUrl(id)); q.make();
    const cnt = q.getModuleCount(), qs = H - 8, cell = qs / cnt, qx = x + 4, qy = y + 4;
    doc.setFillColor(0, 0, 0);
    for (let r = 0; r < cnt; r++) for (let c = 0; c < cnt; c++) if (q.isDark(r, c)) doc.rect(qx + c * cell, qy + r * cell, cell + 0.02, cell + 0.02, 'F');
    const tx = qx + qs + 4, tw = x + W - tx - 3;
    doc.setFont('helvetica', 'bold'); doc.setTextColor(20, 18, 16);
    doc.setFontSize(small ? 34 : 54); doc.text(id, tx, y + (small ? 17 : 24));
    const b = byId(id);
    doc.setFontSize(small ? 8.5 : 11);
    if (b?.name) doc.text(doc.splitTextToSize(b.name, tw).slice(0, 2), tx, y + (small ? 24 : 33));
    else { doc.setLineWidth(0.3); doc.line(tx, y + (small ? 26 : 36), tx + tw, y + (small ? 26 : 36)); }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(small ? 6 : 7.5);
    doc.setLineWidth(0.5); doc.line(tx, y + H - (small ? 8 : 10), tx + tw, y + H - (small ? 8 : 10));
    doc.text('SCAN TO SEE INSIDE', tx, y + H - (small ? 4.5 : 5.5));
  });
  const file = new File([doc.output('blob')], `boxbase-labels-${ids[0]}${ids.length > 1 ? '-' + ids[ids.length - 1] : ''}.pdf`, { type: 'application/pdf' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'BOXBASE labels' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  download(file); toast('Labels PDF downloaded — open it to print');
}

/* ================= expiry helpers ================= */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function expInfo(exp) {
  if (!exp) return null;
  const [y, m, d] = exp.split('-').map(Number);
  const end = d ? new Date(y, m - 1, d, 23, 59) : new Date(y, m, 0, 23, 59);
  const days = Math.ceil((end - Date.now()) / 864e5);
  const cls = days < 0 ? 'bad' : days <= 60 ? 'warn' : 'ok';
  const label = (d ? pad(d) + ' ' : '') + MONTHS[m - 1] + ' ' + String(y).slice(2);
  const when = days < 0 ? 'expired' : days === 0 ? 'today' : days <= 60 ? days + ' days left' : Math.round(days / 30) + ' months left';
  return { days, cls, label, when, end };
}
const expChip = (it, i) => {
  const x = expInfo(it.exp);
  return `<label class="exp ${x ? x.cls : 'none'}" title="Expiry">${x ? (x.days < 0 ? 'EXPIRED' : 'EXP') + ' ' + x.label.toUpperCase() : '+EXP'}<input type="month" data-ex="${i}" value="${it.exp ? it.exp.slice(0, 7) : ''}"></label>`;
};
const isMed = it => !!(it.med || it.exp || it.opened !== undefined);
const shortDate = iso => { const d = new Date(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const openTxt = it => !it.opened ? 'sealed' : it.opened === 'unknown' ? 'opened' : 'opened ' + shortDate(it.opened);
const openChip = it => !it.opened ? 'SEALED' : it.opened === 'unknown' ? 'OPENED · DATE ?' : 'OPENED ' + shortDate(it.opened).toUpperCase();
const today = () => new Date().toISOString().slice(0, 10);
/* small action sheet: when was it opened? → resolves ISO date | 'unknown' | null (sealed) | undefined (cancel) */
function askOpened(it) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    const isOpen = !!it.opened;
    bg.innerHTML = `<div class="msheet card">
      <h2>${isOpen ? 'OPENED' : 'WHEN WAS IT OPENED?'}</h2>
      <div class="tag" style="margin-top:-6px">${esc(it.n || 'This medicine')}${isOpen ? ' · ' + openTxt(it) : ''}</div>
      <div class="stack">
        <button class="btn hot big" data-a="today">Opened today</button>
        <label class="btn big" style="text-align:center;position:relative">Pick the date…
          <input type="date" max="${today()}" data-a="pick" style="position:absolute;inset:0;opacity:0;width:100%;font-size:16px"></label>
        <button class="btn big" data-a="unknown">Opened — don’t know when</button>
        ${isOpen ? '<button class="btn danger big" data-a="sealed">Still sealed</button>' : ''}
        <button class="btn ghost" data-a="cancel">Cancel</button>
      </div></div>`;
    document.body.append(bg);
    const done = v => { bg.remove(); res(v); };
    bg.onclick = e => {
      if (e.target === bg) return done(undefined);
      const a = e.target.dataset.a;
      if (a === 'today') done(today()); else if (a === 'unknown') done('unknown');
      else if (a === 'sealed') done(null); else if (a === 'cancel') done(undefined);
    };
    bg.querySelector('[data-a=pick]').onchange = e => e.target.value && done(e.target.value);
  });
}
const allExpiring = () => boxes.flatMap(b => b.items.map((it, i) => ({ it, i, b, x: expInfo(it.exp) })).filter(r => r.x))
  .sort((a, c) => a.x.days - c.x.days);

function calendarFile() {
  const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const txt = s => String(s).replace(/[\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const now = new Date(), stamp = now.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//BOXBASE//Expiry//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:BOXBASE expiry'];
  let n = 0;
  for (const { it, b, x } of allExpiring()) {
    if (x.days < 0) continue;
    const day = new Date(x.end); day.setDate(day.getDate() - 14);
    if (day < now) { day.setTime(now.getTime()); day.setDate(day.getDate() + 1); }
    const next = new Date(day); next.setDate(next.getDate() + 1);
    L.push('BEGIN:VEVENT', `UID:boxbase-${b.id}-${txt(it.n).replace(/\W/g, '')}-${it.exp}@boxbase`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${ymd(day)}`, `DTEND;VALUE=DATE:${ymd(next)}`,
      `SUMMARY:${txt('Expiring: ' + (it.n || 'item') + ' (Box ' + b.id + ')')}`,
      `DESCRIPTION:${txt('Expires ' + x.label + '. In Box ' + b.id + (b.location ? ' · ' + b.location : '') + '. ' + boxUrl(b.id))}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Medicine expiring soon', 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
    n++;
  }
  L.push('END:VCALENDAR');
  return n ? new File([L.join('\r\n')], 'boxbase-expiry.ics', { type: 'text/calendar' }) : null;
}

/* ---------- 💊 medicine sheet: photo → name + expiry ---------- */
function medSheet(boxId, file) {
  const b = byId(boxId);
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="msheet card">
    <h2>💊 NEW MEDICINE</h2>
    <div class="ms-top"><img id="mimg" alt=""><div style="flex:1;min-width:0"><div class="ms-st" id="mst">Starting…</div><div class="prog"><i id="mpr"></i></div></div></div>
    <label><div class="tag">Name</div><input class="field" id="mn" placeholder="e.g. Dolo 650" autocomplete="off"></label>
    <div class="row" style="gap:14px;flex-wrap:nowrap">
      <label style="flex:2;min-width:0"><div class="tag">Expiry month</div><input class="field" type="month" id="mex"></label>
      <label style="flex:1;min-width:0"><div class="tag">Qty</div><input class="field" type="number" inputmode="numeric" min="1" id="mq" value="1"></label>
    </div>
    <div><div class="tag" style="margin-bottom:6px">Condition</div>
      <div class="seg" id="mseg"><button type="button" class="on" data-v="0">Sealed</button><button type="button" data-v="1">Opened</button></div>
      <label id="mowrap" style="display:none;margin-top:10px"><div class="tag">Opened on — leave blank if you don’t know</div>
        <input class="field" type="date" id="mod" max="${today()}"></label></div>
    <div class="tag" id="mhint"></div>
    <label class="btn" style="text-align:center">📷 Snap the side with EXP<input type="file" accept="image/*" capture="environment" id="mext" hidden></label>
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" id="mcancel" style="flex:1">Cancel</button><button class="btn hot" id="msave" style="flex:2">Save medicine</button></div>
  </div>`;
  document.body.append(bg);
  const $m = s => bg.querySelector(s);
  const st = $m('#mst'), pr = $m('#mpr'), mn = $m('#mn'), mex = $m('#mex'), hint = $m('#mhint');
  const touched = {};
  mn.oninput = () => touched.n = 1; mex.oninput = () => touched.e = 1;
  let scannedExp = null, photoP = compress(file), busy = 0, opened = false;
  $m('#mseg').onclick = e => { const v = e.target.dataset.v; if (v == null) return; opened = v === '1';
    $m('#mseg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === e.target));
    $m('#mowrap').style.display = opened ? '' : 'none'; };
  $m('#mimg').src = URL.createObjectURL(file);
  const close = () => bg.remove();
  $m('#mcancel').onclick = close;
  bg.onclick = e => { if (e.target === bg) close(); };

  async function run(f, wantName) {
    busy++;
    try {
      const r = await MedScan.scan(f, { wantName, onStatus: (msg, p) => { st.className = 'ms-st'; st.textContent = msg; pr.style.width = (p == null ? 12 : 12 + p * 88) + '%'; } });
      if (wantName && r.name && !touched.n && !mn.value) mn.value = r.name;
      if (r.exp && !touched.e) { mex.value = r.exp.slice(0, 7); scannedExp = r.exp; }
      pr.style.width = '100%';
      const gotExp = !!mex.value;
      st.className = 'ms-st ' + (gotExp && r.expSure ? 'good' : 'warn');
      st.textContent = gotExp ? (r.expSure ? '✓ Found it — check & save' : 'Check the expiry date ↓') : 'No expiry found — snap the EXP side, or pick it ↓';
      hint.innerHTML = [r.via.includes('code') ? 'read from the pack’s code' : r.via.includes('text') ? 'read from printed text' : '',
        r.batch ? 'batch ' + esc(r.batch) : '', r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">pack’s QR link ↗</a>` : ''].filter(Boolean).join(' · ');
    } catch (e) { console.error(e); st.className = 'ms-st warn'; st.textContent = 'Couldn’t read it — type it in'; pr.style.width = '100%'; }
    busy--;
  }
  run(file, true);
  $m('#mext').onchange = e => { const f = e.target.files[0]; if (f) { touched.e = 0; run(f, !mn.value); } };
  $m('#msave').onclick = async () => {
    const n = mn.value.trim();
    if (!n && !mex.value) return toast('Add a name or expiry');
    const exp = mex.value ? (scannedExp && scannedExp.startsWith(mex.value) ? scannedExp : mex.value) : null;
    b.items.push({ n, q: Math.max(1, parseInt($m('#mq').value) || 1), p: await photoP, exp, med: true, opened: opened ? ($m('#mod').value || 'unknown') : null });
    await save(b); close(); toast('Saved ' + (n || 'medicine')); viewBox(boxId);
  };
}

function expStrip() {
  const all = allExpiring(); if (!all.length) return '';
  const soon = all.filter(r => r.x.days <= 60);
  const bad = soon.filter(r => r.x.days < 0).length;
  const card = r => `<a class="expcard card" href="#/box/${encodeURIComponent(r.b.id)}">
      ${r.it.p ? `<img src="${r.it.p}" alt="">` : ''}<div class="nm2">${esc(r.it.n || 'Unnamed')}</div>
      <span class="exp ${r.x.cls}">${r.x.days < 0 ? 'EXPIRED' : r.x.when.toUpperCase()}</span><div class="tag">Box ${esc(r.b.id)}${r.it.opened ? ' · opened' : ''}</div></a>`;
  return `<section class="expstrip">
    <div class="hd"><b>${bad ? '⚠ ' : ''}EXPIRY</b><a href="#/expiry">${all.length} tracked →</a></div>
    ${soon.length ? `<div class="exprow">${soon.slice(0, 12).map(card).join('')}</div>`
      : `<div class="allgood card">✓ Nothing expiring in the next 2 months. Next: <b>${esc(all[0].it.n || 'item')}</b> · ${all[0].x.label}</div>`}
  </section>`;
}

function viewHome(focus = false) {
  const list = sorted();
  const totalItems = list.reduce((s, b) => s + b.items.length, 0);
  const dirty = changes(), last = +localStorage.getItem('bb-last') || 0;
  app.innerHTML = `
    ${boxes.length && dirty ? `<div class="banner card"><div><b>${dirty} change${dirty > 1 ? 's' : ''} not backed up</b><div class="tag" style="color:var(--ink)">last backup: ${ago(last)}</div></div><button class="btn ink" id="bk">Save backup</button></div>` : ''}
    ${gapPlan().length ? `<div class="banner card" style="background:var(--tape)"><div><b>Box numbers have gaps</b><div class="tag" style="color:var(--ink)">${numbered().map(x => x.id).join(', ')} → start from 01</div></div><button class="btn ink" id="renum">Renumber</button></div>` : ''}
    <div class="search"><b>⌕</b><input id="q" placeholder="Where's the… passport? charger? winter quilt?" autocomplete="off" enterkeyhint="search"></div>
    ${expStrip()}
    <div class="stats">
      <div><strong>${list.length}</strong>boxes</div>
      <div><strong>${totalItems}</strong>items</div>
      <div><strong>${new Set(list.map(b => b.location).filter(Boolean)).size}</strong>spots</div>
    </div>
    <div id="results"></div>`;

  $('#renum')?.addEventListener('click', renumberAll);
  const input = $('#q');
  const draw = () => {
    const term = input.value.trim().toLowerCase();
    const r = $('#results');
    if (!term) {
      r.innerHTML = list.length ? `<div class="grid">${list.map(boxCard).join('')}</div>`
        : `<div class="empty">No boxes yet.<br>Tap the orange <b>+</b> — or print a sheet of blank labels first from <a href="#/labels">Labels</a>.</div>`;
      return;
    }
    const hits = [];
    for (const b of list) {
      for (const it of b.items) if (it.n.toLowerCase().includes(term)) hits.push({ b, text: it.n, q: it.q, p: it.p, x: expInfo(it.exp), o: isMed(it) ? openTxt(it) : '' });
      if ([b.name, b.location, b.category, b.notes].some(f => (f || '').toLowerCase().includes(term)))
        hits.push({ b, text: b.name || 'Box ' + b.id, boxMatch: true });
    }
    const hl = s => esc(s).replace(new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
    r.innerHTML = hits.length ? `<div class="hits">${hits.map(h => `
      <a class="hit card" href="#/box/${encodeURIComponent(h.b.id)}">
        <div class="n">${esc(h.b.id)}</div>
        <div><div style="font-weight:800;font-size:17px">${hl(h.text)}${h.q > 1 ? ` <span class="tag">×${h.q}</span>` : ''}</div>
        ${h.x ? `<span class="exp ${h.x.cls}" style="display:inline-block;margin:4px 0">${h.x.days < 0 ? 'EXPIRED' : 'EXP'} ${h.x.label.toUpperCase()}</span>` : ''}${h.o ? ` <span class="tag">${h.o}</span>` : ''}
        <div class="tag">${h.boxMatch ? 'box' : 'in ' + esc(h.b.name || 'Box ' + h.b.id)}${h.b.location ? ' · ' + esc(h.b.location) : ''}</div></div>
        ${h.p ? `<img class="hp" src="${h.p}" alt="">` : ''}
      </a>`).join('')}</div>` : `<div class="empty">Nothing matches “${esc(term)}”.</div>`;
  };
  input.addEventListener('input', draw); draw();
  if (focus) input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); }); // hide keyboard to see results
}

function boxCard(b) {
  const peek = b.items.filter(i => i.n).slice(0, 4).map(i => i.n).join(' · ');
  const cover = b.photos[0] || b.items.find(i => i.p)?.p;
  return `<a class="box card" href="#/box/${encodeURIComponent(b.id)}">
    ${cover ? `<img class="thumb" src="${cover}" alt="">` : ''}
    <div class="num"><small>№</small>${esc(b.id)}</div>
    <h3>${esc(b.name || 'Untitled box')}</h3>
    <div class="meta tag">${b.items.length} item${b.items.length === 1 ? '' : 's'}${b.location ? ' · ' + esc(b.location) : ''}</div>
    ${(() => { const xs = b.items.map(i => expInfo(i.exp)).filter(Boolean), bad = xs.filter(x => x.days < 0).length, warn = xs.filter(x => x.days >= 0 && x.days <= 60).length;
      return bad ? `<span class="bx-exp bad">${bad} expired</span>` : warn ? `<span class="bx-exp warn">${warn} expiring</span>` : ''; })()}
    ${peek ? `<div class="peek">${esc(peek)}</div>` : ''}

}

  // snap → new item(s) with photo, focus first unnamed for typing
  $('#snapi').onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return;
    toast(files.length > 1 ? `Adding ${files.length} items…` : 'Adding item…');
    const start = b.items.length;
    for (const f of files) b.items.push({ n: '', q: 1, p: await compress(f) });
    await save(b); viewBox(id);
    app.querySelector(`[data-nm="${start}"]`)?.focus();
  };
  const items = $('#items');
  if (sel && sel.box !== id) sel = null;
  $('#selt')?.addEventListener('click', () => { sel = sel ? null : { box: id, set: new Set() }; viewBox(id); });
  if (sel) {
    const bar = document.createElement('div'); bar.className = 'movebar';
    bar.innerHTML = `<b>${sel.set.size} SELECTED</b><button class="btn" id="mall">${sel.set.size === b.items.length ? 'None' : 'All'}</button><button class="btn hot" id="mgo" ${sel.set.size ? '' : 'disabled style="opacity:.5"'}>Move to box →</button>`;
    app.append(bar);
    $('#mall').onclick = () => { sel.set = sel.set.size === b.items.length ? new Set() : new Set(b.items.map((_, i) => i)); viewBox(id); };
    $('#mgo').onclick = () => sel.set.size && moveSelected(id);
  }
  items.onclick = async e => {
    const t = e.target;
    if (sel) {
      const row = t.closest('[data-row]'); if (!row) return;
      const i = +row.dataset.row;
      sel.set.has(i) ? sel.set.delete(i) : sel.set.add(i);
      const y = scrollY; viewBox(id); scrollTo(0, y); return;
    }
    if (t.dataset.del != null) {
      const it = b.items[+t.dataset.del];
      if ((it.p || it.n) && !confirm(`Remove “${it.n || 'this item'}”?`)) return;
      b.items.splice(+t.dataset.del, 1); await save(b); return viewBox(id);
    }
    if (t.dataset.iv != null) showImg(b.items[+t.dataset.iv].p);
    if (t.dataset.qp != null) { const it = b.items[+t.dataset.qp]; it.q = (it.q || 1) + 1; await save(b); return viewBox(id); }
    if (t.dataset.qm != null) {
      const i = +t.dataset.qm, it = b.items[i];
      if ((it.q || 1) > 1) it.q = (it.q || 1) - 1;
      else if (confirm(`Used up? Remove “${it.n || 'this medicine'}”?`)) b.items.splice(i, 1);
      else return;
      await save(b); return viewBox(id);
    }
    if (t.dataset.op != null) {
      const it = b.items[+t.dataset.op];
      const v = await askOpened(it);
      if (v === undefined) return;
      it.opened = v; await save(b); toast(openTxt(it).replace(/^./, c => c.toUpperCase())); return viewBox(id);
    }
  };
  $('#medi').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) medSheet(id, f); };
  items.onchange = async e => {
    const t = e.target;
    if (t.dataset.ex != null) {                           // set / clear expiry month
      const it = b.items[+t.dataset.ex];
      if (t.value) it.exp = it.exp && it.exp.startsWith(t.value) ? it.exp : t.value; else delete it.exp;
      await save(b); return viewBox(id);
    }
    if (t.dataset.ip != null && t.files[0]) {           // add photo to existing item
      b.items[+t.dataset.ip].p = await compress(t.files[0]); await save(b); return viewBox(id);
    }
    if (t.dataset.nm != null) {                           // rename (supports "3x" too)
      const parsed = parseItem(t.value);
      const it = b.items[+t.dataset.nm];
      if (parsed) { it.n = parsed.n; if (parsed.q > 1) it.q = parsed.q; } else it.n = '';
      await save(b); toast('Saved');
    }
  };
  // Enter on a name → jump to next unnamed item, or open camera for the next one
  items.onkeydown = e => {
    if (e.key !== 'Enter' || e.target.dataset.nm == null) return;
    e.preventDefault(); e.target.blur();
    const next = [...items.querySelectorAll('.nm')].find(x => !x.value && x !== e.target);
    next ? next.focus() : null;
  };
  $('#ph').onchange = async e => {
    toast('Processing photo…');
    for (const f of e.target.files) b.photos.push(await compress(f));
    await save(b); viewBox(id);
  };
  app.querySelector('.photos').onclick = async e => {
    if (e.target.dataset.dp != null) { if (!confirm('Remove this photo?')) return; b.photos.splice(+e.target.dataset.dp, 1); await save(b); return viewBox(id); }
    if (e.target.dataset.view != null) {
      showImg(b.photos[+e.target.dataset.view]);
    }
  };
  $('#delbox').onclick = async () => {
    if (!confirm(`Delete Box ${b.id} and everything logged in it?`)) return;
    await DB.del(b.id); boxes = boxes.filter(x => x !== b); markChanged();
    if (gapPlan().length) { location.hash = '#/'; await renumberAll(); return; }
    toast(`Box ${b.id} deleted`); location.hash = '#/';
  };
}

function viewLabels(params) {
  const only = params.get('only');
  const list = sorted();
  const sel = new Set(only ? only.split(',') : list.map(b => b.id));
  app.innerHTML = `
    <div class="card lab-ctrl">
      <h2 style="font-family:var(--stencil);font-size:30px;margin-bottom:8px">PRINT LABELS</h2>
      <div class="row"><span class="tag">Boxes:</span>
        ${list.map(b => `<label class="chk"><input type="checkbox" value="${esc(b.id)}" ${sel.has(b.id) ? 'checked' : ''}> ${esc(b.id)}</label>`).join('') || '<span class="tag">none yet</span>'}
      </div>
      <div class="row"><span class="tag">Or blank labels:</span>
        <input class="field" id="from" type="number" min="1" value="${list.length ? '' : 1}" placeholder="from" style="width:80px">
        <input class="field" id="to" type="number" min="1" value="${list.length ? '' : 12}" placeholder="to" style="width:80px">
        <span class="tag">— scan a blank one later to set it up</span>
      </div>
      <div class="row"><span class="tag">Size:</span>
        <label class="chk"><input type="radio" name="sz" value="l" checked> Large (2 / row)</label>
        <label class="chk"><input type="radio" name="sz" value="s"> Small (3 / row)</label>
        <button class="btn hot" id="pr" style="margin-left:auto">⎙ Print / PDF</button>
      </div>
    </div>
    <div class="sheet" id="sheet"></div>`;
  const pickIds = () => {
    const ids = [...app.querySelectorAll('.chk input[type=checkbox]:checked')].map(i => i.value);
    const f = parseInt($('#from').value), t = parseInt($('#to').value);
    if (f && t && t >= f && t - f < 300) for (let n = f; n <= t; n++) { const id = pad(n); if (!ids.includes(id)) ids.push(id); }
    return ids.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  };
  const draw = () => {
    const ids = [...app.querySelectorAll('.chk input[type=checkbox]:checked')].map(i => i.value);
    const f = parseInt($('#from').value), t = parseInt($('#to').value);
    if (f && t && t >= f && t - f < 300) for (let n = f; n <= t; n++) { const id = pad(n); if (!ids.includes(id)) ids.push(id); }
    ids.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const sheet = $('#sheet');
    sheet.className = 'sheet' + (app.querySelector('[name=sz]:checked').value === 's' ? ' s' : '');
    sheet.innerHTML = ids.map(id => { const b = byId(id); return `
      <div class="label"><div class="q">${qrSvg(boxUrl(id))}</div>
        <div><div class="ln">${esc(id)}</div>
        ${b?.name ? `<div class="lt">${esc(b.name)}</div>` : '<div class="blank-line"></div>'}
        <div class="lb">Scan to see inside</div></div></div>`; }).join('')
      || '<div class="empty" style="grid-column:1/-1">Pick boxes or a blank range.</div>';
  };
  app.querySelector('.lab-ctrl').addEventListener('input', draw);
  $('#pr').onclick = async () => {
    const ids = pickIds(); if (!ids.length) return toast('Pick boxes or a blank range first');
    const btn = $('#pr'), old = btn.textContent; btn.textContent = 'Making PDF…'; btn.disabled = true;
    try { await labelsPdf(ids, app.querySelector('[name=sz]:checked').value === 's'); }
    catch (e) { console.error(e); toast('Couldn’t make the PDF — check internet once'); }
    btn.textContent = old; btn.disabled = false;
  };
  draw();
}

function viewData() {
  const last = +localStorage.getItem('bb-last') || 0, dirty = changes();
  app.innerHTML = `<div class="data">
    <section class="card panel">
      <h2>BACKUP <span class="tag">${dirty ? dirty + ' unsaved changes' : 'all saved ✓'}</span></h2>
      <p>Your boxes live <b>on this phone</b>. The backup file is your safety net: save it to <b>Google Drive</b> after packing, and load it on any phone to see the same boxes.</p>
      <p class="tag" style="margin-bottom:14px">Last backup: ${ago(last)}</p>
      <div class="stack">
        <button class="btn hot big" id="ex">Save backup → Drive / Files</button>
        <div class="row"><button class="btn" id="dl" style="flex:1">Download .json</button>
          <label class="btn" style="flex:1;text-align:center">Load backup<input type="file" accept="application/json,.json" id="im" hidden></label></div>
      </div>
    </section>
    <section class="card panel" id="fam">
      <h2>FAMILY COPY <span class="tag">${+localStorage.getItem('bb-family-at') ? 'updated ' + ago(+localStorage.getItem('bb-family-at')) : '—'}</span></h2>
      <p>The boxes come preloaded for everyone who opens <b>${esc(location.host + location.pathname)}</b>, and refresh automatically when a newer copy is uploaded.</p>
      <label class="chk" style="margin-top:6px;padding:10px 12px;display:flex;gap:10px"><input type="checkbox" id="mgr" ${isManager() ? 'checked' : ''} style="width:20px;height:20px">
        <span style="font-family:var(--sans);font-size:14px;letter-spacing:0"><b>I manage the boxes on this phone</b> — never replace this phone’s boxes with the family copy</span></label>
    </section>
    <section class="card panel">
      <h2>QR LINK BASE</h2>
      <p>Labels point to this address + <code>#/box/07</code>. Leave blank to use the current page.</p>
      <input class="field" id="base" placeholder="${esc(location.origin + location.pathname)}" value="${esc(localStorage.getItem('bb-base') || '')}">
      <div class="row" style="margin-top:12px"><button class="btn" id="sb">Save</button></div>
    </section>
    <section class="card panel">
      <h2>DANGER ZONE</h2>
      <div class="row"><button class="btn danger" id="wipe">Erase all boxes on this phone</button></div>
    </section></div>`;
  $('#mgr').onchange = e => { e.target.checked ? localStorage.setItem('bb-manager', '1') : (localStorage.removeItem('bb-manager'), localStorage.removeItem('bb-last')); toast(e.target.checked ? 'This phone manages the boxes' : 'This phone follows the family copy'); };
  $('#ex').onclick = () => saveBackup();
  $('#dl').onclick = () => saveBackup(true);
  $('#im').onchange = e => e.target.files[0] && restoreBackup(e.target.files[0]);
  $('#sb').onclick = () => { const v = $('#base').value.trim(); v ? localStorage.setItem('bb-base', v) : localStorage.removeItem('bb-base'); toast('Saved'); };
  $('#wipe').onclick = async () => { if (changes() && !confirm('You have changes that aren’t backed up. Erase anyway?')) return;
    if (prompt('Type ERASE to delete everything') !== 'ERASE') return; await DB.clear(); boxes = []; location.hash = '#/'; };
}

function viewExpiry() {
  const all = allExpiring();
  const groups = [
    ['EXPIRED — THROW OUT', 'bad', r => r.x.days < 0],
    ['NEXT 30 DAYS', 'warn', r => r.x.days >= 0 && r.x.days <= 30],
    ['NEXT 3 MONTHS', 'warn', r => r.x.days > 30 && r.x.days <= 90],
    ['LATER', 'ok', r => r.x.days > 90],
  ];
  const color = { bad: '#d7261e', warn: '#ffb000', ok: '#2f9e44' };
  app.innerHTML = all.length ? `
    <div class="row"><button class="btn ink" id="cal" style="flex:1">📅 Add reminders to calendar</button></div>
    <p class="tag" style="margin:10px 2px 0">A calendar alert 2 weeks before each expiry.</p>
    ${groups.map(([t, c, f]) => { const rows = all.filter(f); return rows.length ? `
      <div class="grp"><i style="background:${color[c]}"></i>${t} <span class="tag">${rows.length}</span></div>
      <div class="hits">${rows.map(r => `
        <div class="hit card">
          <a href="#/box/${encodeURIComponent(r.b.id)}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none">
            ${r.it.p ? `<img class="hp" src="${r.it.p}" alt="" style="margin:0">` : `<div class="n" style="min-width:0">${esc(r.b.id)}</div>`}
            <div style="min-width:0"><div style="font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.it.n || 'Unnamed')}${r.it.q > 1 ? ` <span class="tag">×${r.it.q}</span>` : ''}</div>
            <div class="tag">Box ${esc(r.b.id)} · ${r.x.when}${isMed(r.it) ? ' · ' + openTxt(r.it) : ''}</div></div>
          </a>
          ${r.x.days < 0 ? `<button class="btn" data-gone="${esc(r.b.id)}|${r.i}" style="padding:8px 10px;font-size:11px">Thrown out</button>`
            : `<span class="exp ${r.x.cls}">${r.x.label.toUpperCase()}</span>`}
        </div>`).join('')}</div>` : ''; }).join('')}`
    : `<div class="empty">No expiry dates yet.<br>Open a box → <b>💊 Snap medicine</b>, or tap <b>+EXP</b> on any item.</div>`;
  $('#cal')?.addEventListener('click', () => {
    const f = calendarFile(); if (!f) return toast('Nothing upcoming to remind');
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
    toast('Open the file to add to your calendar');
  });
  app.querySelectorAll('[data-gone]').forEach(btn => btn.onclick = async () => {
    const [bid, i] = btn.dataset.gone.split('|'); const b = byId(bid);
    if (!confirm(`Remove “${b.items[+i].n || 'item'}” from Box ${bid}?`)) return;
    b.items.splice(+i, 1); await save(b); viewExpiry();
  });
}

/* ================= move items between boxes ================= */
let sel = null;            // { box, set:Set<index> } while selecting
function pickBox(fromId, count) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    const others = sorted().filter(x => x.id !== fromId);
    bg.innerHTML = `<div class="msheet card">
      <h2>MOVE ${count} ITEM${count > 1 ? 'S' : ''} TO…</h2>
      <div class="boxpick">
        <button class="new" data-to="__new"><span class="n">+</span><span class="t">New box (Box ${esc(nextId())})</span></button>
        ${others.map(x => `<button data-to="${esc(x.id)}"><span class="n">${esc(x.id)}</span><span><span class="t">${esc(x.name || 'Untitled box')}</span>
          <div class="tag">${x.items.length} items${x.location ? ' · ' + esc(x.location) : ''}</div></span></button>`).join('')}
      </div>
      <button class="btn ghost" data-to="">Cancel</button></div>`;
    document.body.append(bg);
    bg.onclick = e => {
      if (e.target === bg) { bg.remove(); return res(null); }
      const t = e.target.closest('[data-to]'); if (!t) return;
      bg.remove(); res(t.dataset.to || null);
    };
  });
}
async function moveSelected(fromId) {
  const from = byId(fromId), idx = [...sel.set].sort((a, b) => a - b);
  if (!idx.length) return;
  let to = await pickBox(fromId, idx.length);
  if (!to) return;
  let dest;
  if (to === '__new') { dest = newBox(nextId()); boxes.push(dest); } else dest = byId(to);
  const moving = idx.map(i => from.items[i]);
  from.items = from.items.filter((_, i) => !sel.set.has(i));
  dest.items.push(...moving);
  await save(from); await save(dest);
  sel = null;
  toast(`Moved ${moving.length} to Box ${dest.id}`);
  viewBox(fromId);
  const bar = document.createElement('div'); bar.className = 'movebar';
  bar.innerHTML = `<b>MOVED TO BOX ${esc(dest.id)}</b><a class="btn hot" href="#/box/${encodeURIComponent(dest.id)}">Open Box ${esc(dest.id)}</a><button class="btn" id="mvx">✕</button>`;
  app.append(bar); bar.querySelector('#mvx').onclick = () => bar.remove(); setTimeout(() => bar.remove(), 6000);
}

/* ================= router ================= */
async function render() {
  const [path, qs] = location.hash.slice(1).split('?');
  const parts = (path || '/').split('/').filter(Boolean);
  const params = new URLSearchParams(qs || '');
  const route = parts[0] || 'home';
  const tab = route === 'box' || route === 'new' || route === 'expiry' ? 'home' : route;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === tab));
  const titles = { labels: 'LABELS', data: 'BACKUP', search: 'FIND', expiry: 'EXPIRY' };
  $('#bar').innerHTML = route === 'box'
    ? `<a class="back" href="#/"><b>‹</b> Boxes</a><span class="ttl">BOX ${esc(decodeURIComponent(parts[1] || ''))}</span>`
    : `<a class="logo" href="#/">BOX<span>BASE</span></a>${titles[route] ? `<span class="ttl" style="color:#9b9183">${titles[route]}</span>` : ''}`;
  window.scrollTo(0, 0);
  if (sel && !(route === 'box' && decodeURIComponent(parts[1] || '') === sel.box)) sel = null;
  if (route === 'new') { const b = newBox(nextId()); boxes.push(b); await save(b); forceEdit = b.id; location.replace('#/box/' + b.id); return; }
  if (route === 'box') return viewBox(decodeURIComponent(parts[1] || ''));
  if (route === 'labels') return viewLabels(params);
  if (route === 'data') return viewData();
  if (route === 'expiry') return viewExpiry();
  viewHome(route === 'search');
}
window.addEventListener('hashchange', render);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
(async () => { boxes = await DB.all(); render(); syncFamily(); })();
</script>
