<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOXBASE — what's in the box</title>
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BOXBASE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Archivo:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{
  --kraft:#c8a26a; --kraft-d:#a9824b; --paper:#f5efe3; --ink:#141210;
  --hot:#ff4f12; --tape:#e8d9b8; --muted:#5c5246;
  --stencil:'Big Shoulders Stencil Display',Impact,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{
  font-family:var(--sans); color:var(--ink); min-height:100vh; min-height:100dvh;
  background:
    repeating-linear-gradient(92deg,rgba(0,0,0,.025) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(-3deg,rgba(255,255,255,.04) 0 1px,transparent 1px 11px),
    var(--kraft);
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{font-size:16px} /* stops iOS zoom-on-focus */
button,a,label{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{cursor:pointer}
a{color:inherit}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;gap:10px;min-height:56px;
  padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));
  border-bottom:4px solid var(--hot)}
.logo{font-family:var(--stencil);font-weight:900;font-size:30px;letter-spacing:.04em;text-decoration:none;line-height:1}
.logo span{color:var(--hot)}
.back{display:flex;align-items:center;gap:4px;text-decoration:none;font-family:var(--mono);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.08em;height:40px;padding-right:10px}
.back b{font-size:26px;line-height:1;color:var(--hot);margin-top:-3px}
.bar .ttl{margin-left:auto;font-family:var(--stencil);font-weight:900;font-size:24px;letter-spacing:.05em;color:var(--hot)}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);border-top:3px solid var(--ink);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#9b9183;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 0 2px;min-height:48px}
.tabs a svg{width:24px;height:24px}
.tabs a.on{color:var(--hot)}
.tabs .plus{justify-self:center;width:62px;height:62px;margin-top:-26px;background:var(--hot);color:var(--ink);
  border:3px solid var(--ink);box-shadow:0 0 0 3px var(--hot);display:grid;place-items:center;padding:0;transform:rotate(-3deg)}
.tabs .plus svg{width:30px;height:30px}
.tabs .plus:active{transform:rotate(-3deg) scale(.92)}

main{max-width:1080px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left))}
@media(min-width:900px){ .tabs{left:50%;right:auto;transform:translateX(-50%);width:460px;bottom:14px;border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.35)} }

/* ---------- shared ---------- */
.tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.card{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.btn{background:var(--paper);border:2.5px solid var(--ink);padding:10px 14px;font-family:var(--mono);
  font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s, box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.hot{background:var(--hot)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{background:transparent;border-color:#8a1c00;color:#8a1c00;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{width:100%;background:transparent;border:none;border-bottom:2.5px solid var(--ink);padding:8px 2px;font-size:17px;outline:none}
.field:focus{border-bottom-color:var(--hot)}
.empty{font-family:var(--mono);font-size:14px;color:var(--muted);padding:30px 0;text-align:center}

/* ---------- home ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);
  box-shadow:6px 6px 0 var(--ink);padding:4px 14px}
.search input{flex:1;border:none;background:none;outline:none;font-size:20px;padding:12px 0;font-weight:500}
.search b{font-family:var(--stencil);font-size:28px;color:var(--hot)}
.stats{display:flex;gap:22px;margin:22px 2px 18px}
.stats div{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.stats strong{display:block;font-family:var(--stencil);font-size:40px;line-height:1;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.box{position:relative;display:block;text-decoration:none;padding:16px 16px 14px;min-height:170px;overflow:hidden}
.box::before{content:"";position:absolute;top:-6px;left:50%;width:70px;height:22px;transform:translateX(-50%) rotate(-2deg);
  background:var(--tape);opacity:.85;border:1px solid rgba(0,0,0,.08)}
.box .num{font-family:var(--stencil);font-weight:900;font-size:78px;line-height:.85;letter-spacing:-.01em}
.box .num small{font-size:22px;vertical-align:top;margin-right:3px;color:var(--hot)}
.box h3{font-size:18px;font-weight:800;margin-top:10px;line-height:1.15}
.box .meta{margin-top:6px}
.box .thumb{position:absolute;right:12px;top:16px;width:64px;height:64px;object-fit:cover;border:2.5px solid var(--ink);transform:rotate(3deg)}
.box .peek{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.hits{margin-top:18px;display:grid;gap:10px}
.hit{display:flex;align-items:center;gap:14px;padding:12px 14px;text-decoration:none}
.hit .n{font-family:var(--stencil);font-size:36px;line-height:1;min-width:58px;color:var(--hot);-webkit-text-stroke:1px var(--ink)}
.hit mark{background:var(--hot);color:var(--ink);padding:0 2px}

/* ---------- box view ---------- */
.head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:end;margin-bottom:22px}
.bignum{font-family:var(--stencil);font-weight:900;font-size:clamp(110px,26vw,190px);line-height:.8;color:var(--paper);
  -webkit-text-stroke:3px var(--ink);text-shadow:7px 7px 0 var(--ink)}
.head .name{font-size:clamp(24px,5vw,38px);font-weight:800;border-bottom-width:3px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px}
.cols>*,.head>*{min-width:0}
.add .field{min-width:0}
@media(max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}.head{grid-template-columns:1fr}}
.panel{padding:18px}
.panel h2{font-family:var(--stencil);font-size:28px;letter-spacing:.03em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 .tag{font-size:11px}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input{flex:1}
.items{list-style:none}
.items li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1.5px dashed #b9ad97;font-size:16px}
.items li span{flex:1}
.items li .nm{flex:1;min-width:0;border:none;background:transparent;font-size:16px;padding:4px 2px;outline:none;border-bottom:2px solid transparent}
.items li .nm:focus{border-bottom-color:var(--hot)}
.items li .nm:placeholder-shown{border-bottom-color:var(--hot);background:rgba(255,79,18,.08)}
.it-ph{flex:none;width:56px;height:56px;border:2.5px solid var(--ink);background:#fff;object-fit:cover;display:block;cursor:zoom-in}
.it-add{flex:none;width:56px;height:56px;border:2px dashed #9c8f78;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:20px;color:var(--muted)}
.it-add:hover{border-color:var(--hot);color:var(--hot)}
.snap{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:14px;padding:16px;
  font-family:var(--stencil);font-weight:900;font-size:24px;letter-spacing:.05em;background:var(--ink);color:var(--paper);
  border:3px solid var(--ink);box-shadow:4px 4px 0 var(--hot);cursor:pointer}
.snap:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--hot)}
.snap svg{width:26px;height:26px}
.hit .hp{width:48px;height:48px;object-fit:cover;border:2px solid var(--ink);margin-left:auto}
.items li .q{font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--paper);padding:2px 6px}
.x{border:none;background:none;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--muted);
  min-width:40px;min-height:40px;display:grid;place-items:center;flex:none}
.x:hover{color:var(--hot)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:10px}
.photos figure{position:relative;aspect-ratio:1;border:2.5px solid var(--ink);background:#ddd}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .x{position:absolute;top:0;right:0;min-width:30px;min-height:30px;background:var(--ink);color:var(--paper);font-size:12px;line-height:1}
.qrmini{display:flex;gap:14px;align-items:center;margin-top:14px}
.qrmini .q{width:92px;height:92px;background:#fff;border:2.5px solid var(--ink);padding:4px}
.qrmini .q svg{width:100%;height:100%;display:block}
label.l{display:block;margin-top:14px}
.lightbox{position:fixed;inset:0;background:rgba(20,18,16,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border:3px solid var(--paper)}

/* ---------- labels ---------- */
.lab-ctrl{padding:18px;margin-bottom:26px}
.lab-ctrl .row+.row{margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;padding:6px 9px;border:2px solid var(--ink);background:var(--paper)}
.chk input{accent-color:var(--hot)}
.sheet{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.sheet.s{grid-template-columns:repeat(3,1fr)}
.label{background:#fff;border:3px solid var(--ink);padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;break-inside:avoid;page-break-inside:avoid}
.label .q svg{width:118px;height:118px;display:block}
.sheet.s .label .q svg{width:84px;height:84px}
.label .ln{font-family:var(--stencil);font-weight:900;font-size:64px;line-height:.85}
.sheet.s .label .ln{font-size:44px}
.label .lt{font-weight:800;font-size:14px;margin-top:6px;line-height:1.15}
.label .lb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;border-top:2px solid var(--ink);padding-top:4px}
.blank-line{border-bottom:1.5px solid var(--ink);height:16px;margin-top:6px}

/* ---------- data ---------- */
.data .panel{margin-bottom:22px}
.data p{line-height:1.5;margin:6px 0 12px;max-width:62ch}
code{font-family:var(--mono);font-size:.88em;background:var(--tape);padding:1px 5px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:13px;padding:11px 16px;border-left:6px solid var(--hot);z-index:60;white-space:nowrap;
  animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
.lightbox{padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}

/* ---------- cloud ---------- */
body.auth .tabs,body.auth .bar{display:none}
body.auth{padding-bottom:0}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:#9b9183;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.ok{color:#6fd36f}.sync.wait{color:var(--hot)}.sync.off{color:#e8c04f}
.bar .ttl{margin-left:12px}
.login{max-width:440px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 22px 40px;display:flex;flex-direction:column;gap:16px}
.login .mark{font-family:var(--stencil);font-weight:900;font-size:clamp(54px,17vw,84px);line-height:.85;color:var(--paper);
  -webkit-text-stroke:2.5px var(--ink);text-shadow:6px 6px 0 var(--ink);margin-bottom:6px}
.login .mark span{color:var(--hot)}
.login .or{text-align:center;margin:6px 0 -4px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn.big{width:100%;padding:17px;font-size:15px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px;margin-bottom:18px;background:var(--hot)}
.members{list-style:none}
.members li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1.5px dashed #b9ad97;font-family:var(--mono);font-size:14px}
.members li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){ .bar .ttl{font-size:20px} .bar .ttl.sub{display:none} .sync{font-size:9px} }

/* ---------- phone ---------- */
@media(max-width:600px){
  main{padding-top:16px}
  .card{box-shadow:4px 4px 0 var(--ink)}
  .search{box-shadow:4px 4px 0 var(--ink);padding:2px 12px}
  .search input{font-size:17px;padding:13px 0}
  .stats{gap:18px;margin:18px 2px 14px}
  .stats strong{font-size:34px}
  .grid{grid-template-columns:1fr 1fr;gap:14px}
  .box{min-height:148px;padding:14px 12px 12px}
  .box .num{font-size:58px}
  .box .num small{font-size:16px}
  .box h3{font-size:15px;margin-top:8px}
  .box .thumb{width:44px;height:44px;right:8px;top:12px}
  .box .peek{display:none}
  .box .meta{font-size:10px;letter-spacing:.08em}
  .hit{padding:10px 12px;gap:12px}
  .hit .n{font-size:30px;min-width:44px}

  .head{gap:6px;margin-bottom:18px}
  .bignum{font-size:118px;text-shadow:5px 5px 0 var(--ink);-webkit-text-stroke:2.5px var(--ink)}
  .head .name{font-size:24px}
  .cols{gap:18px}
  .panel{padding:14px}
  .panel h2{font-size:24px}
  .snap{font-size:22px;padding:18px 14px}
  .add .btn{padding:10px 12px}
  .items li{gap:8px;padding:8px 0}
  .it-ph,.it-add{width:52px;height:52px}
  .photos{grid-template-columns:repeat(3,1fr)}
  .qrmini .tag{font-size:9px}

  .lab-ctrl{padding:14px}
  .lab-ctrl .row{gap:8px}
  #pr{margin-left:0!important;width:100%}
  .sheet,.sheet.s{grid-template-columns:1fr}
  .data .row .btn,.data .row label.btn{flex:1;text-align:center}
}

@media print{
  @page{margin:10mm}
  body{background:#fff;padding:0}
  .bar,.tabs,.lab-ctrl,.noprint{display:none!important}
  .sheet{grid-template-columns:repeat(2,1fr)!important}
  .sheet.s{grid-template-columns:repeat(3,1fr)!important}
  main{padding:0;max-width:none}
  .sheet{gap:6mm}
  .label{box-shadow:none}
}
</style>
</head>
<body>
<header class="bar noprint" id="bar"></header>
<main id="app"></main>
<nav class="tabs noprint">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg>Boxes</a>
  <a href="#/search" data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>Find</a>
  <a href="#/new" class="plus" aria-label="New box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M12 4v16M4 12h16"/></svg></a>
  <a href="#/labels" data-nav="labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM18 18h3v3M21 14v1"/></svg>Labels</a>
  <a href="#/data" data-nav="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Account</a>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
